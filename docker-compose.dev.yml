# Development configuration with hot-reload
# Reuses Redis, PostgreSQL, MinIO from ai-audio-assistant
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  # ============ API Server (Development) ============
  api:
    build: .
    container_name: nano-banana-api-dev
    ports:
      - "8001:8888"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      # Reuse existing infrastructure (Docker host network)
      - REDIS_URL=redis://192.168.1.10:6379/1
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgresql+asyncpg://user:pass@192.168.1.10:5432/idea_generator
      - MINIO_ENDPOINT=192.168.1.10:9000
      - STORAGE_BACKEND=minio
      - STORAGE_PUBLIC_URL=http://192.168.1.10:9000/idea-generator
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_SERVICE_URL=http://auth-service:8100
      - AUTH_SERVICE_CLIENT_ID=${AUTH_SERVICE_CLIENT_ID}
    volumes:
      - .:/app
      - ./outputs:/app/outputs
    command: uvicorn api.main:app --host 0.0.0.0 --port 8888 --reload
    restart: unless-stopped
