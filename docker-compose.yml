services:
  api:
    build: .
    container_name: nano-banana-api
    ports:
      - "8888:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - REDIS_URL=redis://192.168.1.10:6379/1
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgresql+asyncpg://prompthub:prompthub_dev@192.168.1.10:5432/idea_generator
      - GOOGLE_API_KEY=${PROVIDER_GOOGLE_API_KEY}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_SERVICE_URL=http://auth-service:8100
      - AUTH_SERVICE_CLIENT_ID=${AUTH_SERVICE_CLIENT_ID}
      - MINIO_ENDPOINT=192.168.1.10:9000
      - STORAGE_PUBLIC_URL=http://192.168.1.10:9000/idea-generator
    env_file:
      - .env
    volumes:
      - .:/app
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    networks:
      - nano-banana-network

  worker:
    build: .
    container_name: nano-banana-worker
    command: arq api.workers.WorkerSettings
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - REDIS_URL=redis://192.168.1.10:6379/1
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgresql+asyncpg://prompthub:prompthub_dev@192.168.1.10:5432/idea_generator
      - GOOGLE_API_KEY=${PROVIDER_GOOGLE_API_KEY}
      - MINIO_ENDPOINT=192.168.1.10:9000
      - STORAGE_PUBLIC_URL=http://192.168.1.10:9000/idea-generator
    env_file:
      - .env
    volumes:
      - .:/app
      - ./outputs:/app/outputs
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - nano-banana-network

networks:
  nano-banana-network:
    external: true
