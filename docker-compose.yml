version: '3.8'

services:
  # ============ API Server ============
  api:
    build: .
    container_name: nano-banana-api
    ports:
      - "8888:8000"
    environment:
      # Application
      - ENVIRONMENT=production
      - DEBUG=false
      # Redis (dev server, DB 1 to avoid conflict)
      - REDIS_URL=redis://192.168.1.10:6379/1
      # PostgreSQL
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgresql+asyncpg://prompthub:prompthub_dev@192.168.1.10:5432/idea_generator
      # Google Gemini API
      - GOOGLE_API_KEY=${PROVIDER_GOOGLE_API_KEY}
      # Auth Service
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_SERVICE_URL=http://auth-service:8100
      - AUTH_SERVICE_CLIENT_ID=${AUTH_SERVICE_CLIENT_ID}
      # Storage (MinIO on dev server)
      - MINIO_ENDPOINT=192.168.1.10:9000
      - STORAGE_PUBLIC_URL=http://192.168.1.10:9000/idea-generator
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============ ARQ Worker (Task Queue) ============
  worker:
    build: .
    container_name: nano-banana-worker
    command: arq api.workers.WorkerSettings
    environment:
      # Application
      - ENVIRONMENT=production
      - DEBUG=false
      # Redis (dev server, DB 1 to avoid conflict)
      - REDIS_URL=redis://192.168.1.10:6379/1
      # PostgreSQL
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgresql+asyncpg://prompthub:prompthub_dev@192.168.1.10:5432/idea_generator
      # Google Gemini API
      - GOOGLE_API_KEY=${PROVIDER_GOOGLE_API_KEY}
      # Storage (MinIO on dev server)
      - MINIO_ENDPOINT=192.168.1.10:9000
      - STORAGE_PUBLIC_URL=http://192.168.1.10:9000/idea-generator
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
    # Worker doesn't expose ports, just processes background jobs

networks:
  default:
    name: nano-banana-network
